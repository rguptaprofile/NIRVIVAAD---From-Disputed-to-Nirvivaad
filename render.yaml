services:
  - type: web
    name: nirvivaad-api
    runtime: python
    rootDir: Backend
    buildCommand: python -m pip install --upgrade pip && python -m pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: nirvivaad
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/nirvivaad-uploads
