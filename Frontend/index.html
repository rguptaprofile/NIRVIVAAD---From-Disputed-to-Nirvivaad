<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NIRVIVAAD | Land Record Intelligence</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />

    <!-- Load Mapbox GL JS CSS -->
    <link href="https://mapbox.com" rel="stylesheet">
    <!-- Load Mapbox GL JS Script -->
    <script src="https://mapbox.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>



<div id="map"></div>

    <script>
        // 1. PASTE YOUR MAPBOX ACCESS TOKEN HERE
        mapboxgl.accessToken = 'pk.eyJ1IjoicnJhai1paXRwIiwiYSI6ImNtdTZiZm40cjA5M2gyeHNsNjhvenQ1dGsifQ.NW68R9t_5yV99rAnhb0ezA';

        // 2. Initialize the map (WGS84 Coordinates default: [Longitude, Latitude])
        const Map = new mapboxgl.Map({
            container: 'map', // ID of the div element
            style: 'mapbox://styles/mapbox/streets-v12', // Map style URL
            center: [-74.0060, 40.7128], // Starting position [lng, lat] (New York City)
            zoom: 12 // Starting zoom level
        });

        // 3. Wait until the map style loads before adding the GeoJSON data
        Map.on('load', () => {

            // Add your WGS84 GeoJSON Data Source
            map.addSource('my-geojson-features', {
                'type': 'geojson',
                'data': {
                    'type': 'FeatureCollection',
                    'features': [
                        {
                            'type': 'Feature',
                            'properties': {
                                'description': 'A sample point feature'
                            },
                            'geometry': {
                                'type': 'Point',
                                'coordinates': [-74.0060, 40.7128] // WGS84 [Lng, Lat]
                            }
                        }
                    ]
                }
            });

            // Add a visual layer to render the GeoJSON source as a red circle
            map.addLayer({
                'id': 'geojson-layer',
                'type': 'circle',
                'source': 'my-geojson-features',
                'paint': {
                    'circle-radius': 8,
                    'circle-color': '#B71C1C'
                }
            });
        });
    </script>
    


    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
